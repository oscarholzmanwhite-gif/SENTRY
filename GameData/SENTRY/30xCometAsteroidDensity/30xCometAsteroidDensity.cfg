// Multiply asteroid and comet densities by 30.
// PotatoRoid and PotatoComet are separate part modules (ModuleAsteroid and ModuleComet), each with
// its own independent `density` field - ModuleComet does NOT derive from ModuleAsteroid, so a single
// @MODULE[ModuleAsteroid] selector never matches on PotatoComet and silently leaves comet density
// untouched. Patch each module by its own name.
@PART[PotatoRoid]:FINAL
{
    @MODULE[ModuleAsteroid]
    {
        @density *= 30
    }
}

@PART[PotatoComet]:FINAL
{
    @MODULE[ModuleComet]
    {
        @density *= 30
    }
}