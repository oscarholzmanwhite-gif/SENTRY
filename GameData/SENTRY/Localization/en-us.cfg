// SENTRY English strings. NOT under PluginData - GameDatabase (which is what actually
// reads "Localization" nodes) skips any folder named PluginData while indexing GameData. Placeholders use KSP's own Lingoona syntax (<<1>>,
// <<2>>, ... - 1-indexed, not {0}/{1}). Values arriving as args are already formatted (e.g. "F0"-rounded) in code
// before being passed in, since Lingoona substitution has no .NET numeric-format-specifier syntax
// of its own.
//
// NEVER write "<<n>>'s" for a possessive. Lingoona reads the apostrophe-s immediately after a
// placeholder as its own genitive marker and renders it as a prepositional phrase instead:
// "<<2>>'s atmosphere" with arg "Kerbin" came out in-game as "of a Kerbin atmosphere" Phrase possessives the long way round -
// "the atmosphere of <<2>>" - which is unambiguous to the templating engine.
//
// This first pass covers the player-facing alert titles/messages in SentryScenario.cs
// (AlertLog.Alert/Notice call sites) only - AlertLog.Info is log-only and never shown to the
// player, and the AlertWindow UI labels/tooltips are a separate, not-yet-done pass.
Localization
{
    en-us
    {
        #SENTRY_title_impactImminent = Impact imminent
        #SENTRY_msg_impactImminent = <<1>> is about to impact <<2>>.

        #SENTRY_title_impact = Impact
        #SENTRY_msg_impactConfirmed = <<1>> vanished after its predicted <<2>> entry at UT <<3>>, last seen at <<4>> m altitude <<5>> m/s surface speed. It has hit.
        // Used when no precise last-known altitude/speed sample exists at all (a very fast
        // destructive reentry can apparently sometimes outrun WatchImminentImpacts' own per-frame
        // sampling - see ThreatRecord.WasInAtmosphere), but there's still solid independent
        // evidence (Vessel.atmDensity, and never having safely landed) that it was destroyed in
        // the atmosphere rather than recovered or lost track of some other way.
        #SENTRY_msg_impactConfirmedFallback = <<1>> was lost while in the atmosphere of <<2>>, with no precise last-known altitude/speed sample. Treated as a confirmed impact.
        // Appended to #SENTRY_msg_impactConfirmed when ImpactConsequence.Compute succeeds. <<2>> is
        // one of the three burst-description fragments below, <<3>> one of the two land/ocean
        // fragments further below (all localized, not hardcoded English) - neither is a
        // placeholder-adjacent possessive. <<7>> reflects a real applied reputation change in
        // career mode (SentryScenario.ReportConfirmedImpact calls Reputation.Instance.AddReputation
        // with this same value). Funds/facility damage are reported separately, in
        // #SENTRY_frag_facilityDamage, appended right after this fragment only when applicable.
        #SENTRY_frag_consequenceReport = Estimated energy <<1>> kt TNT (<<2>>) over <<3>> at <<4>> deg lat, <<5>> deg long - tracked for <<6>> d before impact. Public confidence took a hit: -<<7>> reputation.
        // DescribeBurst() in SentryScenario.cs picks one of these three as the pre-formatted <<2>>
        // arg above, based on ConsequenceReport.Class.
        #SENTRY_frag_burstAirburst = airburst at <<1>> m
        #SENTRY_frag_burstGroundBurst = low airburst at <<1>> m
        #SENTRY_frag_burstCrater = reached the surface intact
        // ReportConfirmedImpact picks one of these two as the pre-formatted <<3>> arg above, based
        // on ConsequenceReport.IsOcean (CelestialBody.TerrainAltitude < 0 at the impact lat/long).
        #SENTRY_frag_land = land
        #SENTRY_frag_ocean = ocean
        // Appended (with a leading space, not a new line) right after #SENTRY_frag_consequenceReport
        // only when ConsequenceReport.FacilityWouldBeDamaged. No funds figure quoted here by
        // design (owner's decision, 2026-09-26): SENTRY never deducts a rebuild cost itself -
        // buildings are just left destroyed (demolition queued for the next time the player is
        // actually in the Space Center scene, since DestructibleBuilding instances only exist as
        // live GameObjects there - see SentryScenario.pendingFacilityTier/
        // TryApplyPendingFacilityDamage) for the player to repair on their own terms, at whatever
        // cost stock's own repair UI actually charges.
        #SENTRY_frag_facilityDamage = KSC facilities took direct damage and will need repair.

        // OnCometSpawned detects a comet-breakup fragment by name and flags the parent so its own
        // disappearance is reported here instead of as a confirmed impact - see
        // ThreatRecord.FragmentedNotImpacted.
        #SENTRY_title_cometFragmented = Comet fragmented
        #SENTRY_msg_cometFragmented = <<1>> broke apart under atmospheric stress before reaching the surface of <<2>>. Each fragment is now tracked independently - no impact penalty applied to the parent.

        #SENTRY_title_impactUncertain = Impact status uncertain
        #SENTRY_msg_impactUncertain = <<1>> disappeared near its predicted <<2>> impact (<<3>>), which doesn't clearly show a destructive impact - it may have been recovered, destroyed, or landed softly.
        #SENTRY_frag_noSample = no recent altitude/speed sample
        #SENTRY_frag_lastKnownState = <<1>> m altitude, <<2>> m/s surface speed

        #SENTRY_title_impactPredicted = Impact predicted
        #SENTRY_msg_impactPredicted = <<1>> will enter the atmosphere/surface of <<2>> at <<3>> (periapsis <<4>> m, threshold <<5>> m). SOI entry at <<6>>.

        #SENTRY_title_allClear = All clear
        #SENTRY_msg_allClearToNearPass = <<1>> is no longer on an impact course; it will pass through the SOI of <<2>> with periapsis <<3>> m at <<4>>.
        #SENTRY_msg_allClearToCloseApproach = <<1>> is no longer on a <<2>> encounter course; closest approach now <<3>> m at <<4>>.
        #SENTRY_msg_allClearToIgnored = <<1>> is no longer on an impact course; no <<2>> encounter predicted (<<3>>).
        #SENTRY_msg_allClearLanded = <<1>> has come to rest on the surface of <<2>>; no longer an active impact threat.

        #SENTRY_title_cometApproachingSoi = Comet approaching SOI
        #SENTRY_msg_cometApproachingSoi = <<1>> will pass through the SOI of <<2>>: entry <<3>>, periapsis <<4>> m.

        #SENTRY_title_cometApproach = Comet approach
        #SENTRY_msg_cometApproach = <<1>> will pass within <<2>> m of <<3>> at <<4>> (no SOI entry).

        #SENTRY_title_impactRevised = Impact time revised
        #SENTRY_msg_impactRevised = <<1>> now expected at <<2>> (was UT <<3>>, shift <<4>> s).
    }
}
